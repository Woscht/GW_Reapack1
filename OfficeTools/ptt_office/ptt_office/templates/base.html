<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PTT Office{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #fff;
      --border: #d8dde6;
      --text: #1a1f2e;
      --muted: #5c6578;
      --accent: #2f6fed;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
    }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    th, td {
      padding: 0.6rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { background: #eef1f6; font-weight: 600; font-size: 0.85rem; }
    tr:last-child td { border-bottom: none; }
    .num { font-variant-numeric: tabular-nums; text-align: right; }
    form.filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
      margin-bottom: 1.25rem;
      padding: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    label { display: flex; flex-direction: column; font-size: 0.85rem; color: var(--muted); }
    input[type="text"] {
      margin-top: 0.25rem;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      min-width: 12rem;
    }
    button, .btn {
      padding: 0.45rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    details { margin-top: 1rem; }
    summary { cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">PTT Office</a></h1>
    <p>
      Last import:
      {% if status and status.last_import_at %}{{ status.last_import_at }}{% else %}—{% endif %}
      · mirrored files: {{ status.files_count if status else 0 }}
    </p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
